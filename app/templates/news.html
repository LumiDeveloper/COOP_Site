<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} — КТТО</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: 'Open Sans', 'Roboto', 'Segoe UI', sans-serif;
            color: #1f2e3a;
        }
        .wrapper { max-width: 1400px; margin: 0 auto; padding: 0 30px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 3px solid #01AABD;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .logo img { height: 55px; width: auto; }
        .nav { display: flex; gap: 24px; flex-wrap: wrap; }
        .nav a {
            text-decoration: none;
            font-weight: 600;
            color: #1f2e3a;
            padding: 8px 18px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .nav a:hover { background: #01AABD; color: white; }

        .news-container { max-width: 1000px; margin: 0 auto 60px; }
        .news-title { font-size: 2.2rem; font-weight: 800; margin: 20px 0 10px; }
        .news-date { color: #01AABD; font-weight: 600; margin-bottom: 30px; }
        .news-content { font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 24px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            cursor: pointer;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 16px;
        }
        .back-link { display: inline-block; margin-top: 30px; color: #01AABD; text-decoration: none; }

        @media (max-width: 860px) {
            .wrapper { padding: 0 20px; }
            .header { flex-direction: column; text-align: center; }
            .news-title { font-size: 1.5rem; }
        }

        .main-image {
            margin-bottom: 30px;
            border-radius: 32px;
            overflow: hidden;
        }
        .main-image img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <div class="logo"><img src="/src/logoKTTO.jpg" alt="Логотип"></div>
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/about">О нас</a>
            <a href="/admission">Поступление</a>
            <a href="/students">Студентам</a>
            <a href="/contacts">Контакты</a>
        </div>
    </div>

    <div class="news-container">
    {% if post.image_url %}
    <div class="main-image">
        <img src="{{ post.image_url }}" alt="Обложка новости">
    </div>
    {% endif %}
    <div class="news-title">{{ post.title }}</div>
    <div class="news-date">{{ post.date }}</div>
    <div class="news-content">{{ post.description }}</div>

        {% if images %}
        <h3>Фотогалерея</h3>
        <div class="gallery">
            {% for img in images %}
            <img src="{{ img.image_url }}" alt="Фото" onclick="openModal(this.src)">
            {% endfor %}
        </div>
        {% else %}
        <p>Нет дополнительных фотографий</p>
        {% endif %}

        <a href="/all-news" class="back-link">← Ко всем новостям</a>
    </div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" src="">
</div>

<script>
    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'block';
    }
    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>
</body>
</html>
